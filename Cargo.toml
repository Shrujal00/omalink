[workspace]
resolver = "2"
members = ["crates/proto", "crates/net", "desktop", "android/core"]
default-members = ["crates/proto", "crates/net", "desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
