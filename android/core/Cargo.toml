[package]
name = "omalink-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omalink-proto = { path = "../../crates/proto" }
serde_json.workspace = true
