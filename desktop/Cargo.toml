[package]
name = "omalink"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omalink-proto = { path = "../crates/proto" }
serde.workspace = true
serde_json.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
base64 = "0.22"
aes-gcm = "0.10"
omalink-net = { path = "../crates/net" }
openh264 = "0.9.10"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
cxx-qt-build = "0.10"
